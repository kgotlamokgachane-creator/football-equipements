<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHECKOUT | KM GEARS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/scrollreveal"></script>
    <link rel="stylesheet" href="main.css">
</head>
<body class="faq">

<nav class="navbar navbar-expand-lg fixed-top navbar-dark">
    <div class="container-fluid px-5">
        <a href="index.html" class="navbar-brand logo">KM<span>GEARS</span></a>
    </div>
</nav>

<section class="checkout-container reveal py-5">
    <div class="container">
        <div class="row g-5">

            <article class="col-lg-7 checkout-form-section">
                <h2 class="h4 mb-4">Shipping Details</h2>
                <form id="payment-form">
                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control" placeholder="John Doe" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        <input type="email" class="form-control" placeholder="john@example.com" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Shipping Address (Botswana)</label>
                        <input type="text" class="form-control" placeholder="Plot / Street / Ward" required>
                    </div>

                    <h2 class="h4 mb-4">Payment</h2>
                    <div class="mb-3">
                        <label class="form-label">Card Number</label>
                        <input type="text" class="form-control" placeholder="0000 0000 0000 0000" maxlength="19" required>
                    </div>
                    <div class="row g-3 mb-3">
                        <div class="col-sm-6">
                            <label class="form-label">Expiry Date</label>
                            <input type="text" class="form-control" placeholder="MM/YY" maxlength="5" required>
                        </div>
                        <div class="col-sm-6">
                            <label class="form-label">CVV</label>
                            <input type="password" class="form-control" placeholder="***" maxlength="3" required>
                        </div>
                    </div>
                    <button type="submit" class="btn-pay w-100">CONFIRM PURCHASE</button>
                </form>
            </article>

            <aside class="col-lg-5 order-summary">
                <h2 class="h4 mb-4">Your Order</h2>
                <article class="summary-item mb-2">
                    <span>KM ELITE V1 (Red)</span>
                    <span>P550.00</span>
                </article>
                <article class="summary-item mb-4">
                    <span>Shipping</span>
                    <span>FREE</span>
                </article>
                <article class="summary-item total border-top pt-3">
                    <span>TOTAL</span>
                    <span>P550.00</span>
                </article>
            </aside>

        </div>
    </div>
</section>

<section id="success-overlay">
    <span style="font-size: 4rem; margin-bottom: 20px;">🛡️</span>
    <h1>PURCHASE SUCCESSFUL</h1>
    <p>Your gear is being prepared for the pitch.</p>
    <a href="index.html" class="btn-pay" style="width: auto; text-decoration: none; display: inline-block;">RETURN TO HOME</a>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    ScrollReveal().reveal('.reveal', { delay: 200, distance: '30px', origin: 'bottom', duration: 800 });

    document.getElementById('payment-form').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const btn = document.querySelector('.btn-pay');
        btn.innerText = "PROCESSING...";
        btn.style.opacity = "0.5";
        btn.disabled = true;

        setTimeout(() => {
            document.getElementById('success-overlay').style.display = 'flex';
            window.scrollTo(0, 0);
        }, 2000);
    });
</script>
</body>
</html>
